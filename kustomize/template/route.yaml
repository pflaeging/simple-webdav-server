kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: simple-webdav-server
  annotations:
    kubernetes.io/tls-acme: 'true'
    haproxy.router.openshift.io/disable_cookies: 'true'
spec:
  host: davtest.dev.pflaeging.net
  to:
    kind: Service
    name: $(ROUTE_SERVICE)
    weight: 100
  port:
    targetPort: http-alternate
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None