apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../base
- route.yaml

commonLabels:
  pflaeging.net/stage: test

patchesStrategicMerge:
# patch storageclasses
  - |-
    kind: PersistentVolumeClaim
    apiVersion: v1
    metadata:
      name: simple-webdav-server
    spec:
      storageClassName: rook-cephfs
      resources:
        requests:
          storage: 1Gi

images:
- name: quay.io/pflaeging/simple-webdav-server:latest
  newName: image-registry.openshift-image-registry.svc:5000/develop/simple-webdav-server
  newTag: "latest"
