kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: simple-webdav-server-webdav
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: openshift-default
  tls:
    - hosts:
        - overwrite.by.kustomize.dev
      secretName: simple-webdav-server-webdav-secret
  rules:
    - host: overwrite.by.kustomize.dev
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: simple-webdav-server-webdav
                port:
                  number: 8081
